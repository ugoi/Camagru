<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Login - CamGuru</title>
    <meta name="description" content="Login to your CamGuru account" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--[if lt IE 7]>
      <p
        class="browsehappy"
        style="background-color: #ffcc00; padding: 10px; text-align: center"
      >
        You are using an <strong>outdated</strong> browser. Please
        <a href="#" style="color: #0000ee">upgrade your browser</a> to improve
        your experience.
      </p>
    <![endif]-->
    <main class="login-container">
      <form id="login-form">
        <h1 class="login-title">Welcome Back</h1>

        <div
          id="loginSuccess"
          class="message success-message"
          style="display: none"
        >
          <p>Login successful</p>
        </div>
        <div
          id="loginError"
          class="message error-message"
          style="display: none"
        >
          <p>Login failed</p>
        </div>

        <div class="form-group">
          <label for="username" class="form-label">Username or Email</label>
          <input
            type="text"
            name="username"
            id="username"
            class="form-input"
            placeholder="Enter your username or email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            name="password"
            id="password"
            class="form-input"
            placeholder="Enter your password"
            required
          />
        </div>

        <a href="/forgot-password" class="forgot-password">
          Forgot password?
        </a>

        <button type="submit" class="login-button">Login</button>

        <div class="signup-prompt">
          Don't have an account?
          <a href="/register" class="signup-link">Sign up</a>
        </div>
      </form>
    </main>

    <script type="module">
      import { handleLogin } from "./login.js";
      const loginForm = document.querySelector("#login-form");
      loginForm.addEventListener("submit", (event) => {
        handleLogin(event);
      });
    </script>
  </body>
</html>
