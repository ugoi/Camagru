<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editing Page</title>
    <link rel="stylesheet" href="test.css" />
    <link rel="stylesheet" href="../styles.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Lora:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="root">
      <camagru-header></camagru-header>
      <button class="mobile-nav-button" id="mobile-nav-button">
        <i class="fas fa-bars"></i>
      </button>
      <div class="mobile-menu" id="mobile-menu">
        <button class="mobile-menu-item active" data-tab="main">
          Webcam Preview
        </button>
        <button class="mobile-menu-item" data-tab="side">
          Previous Captures
        </button>
      </div>
      <div class="container">
        <main class="main active">
          <section class="webcam-preview">
            <div class="title-wrapper">
              <h2>Webcam Preview</h2>
            </div>
            <div class="webcam-container">
              <div class="webcam-loading">
                <div class="camera-loader"></div>
              </div>
              <video id="webcam" autoplay></video>
            </div>

            <div id="snapshot-image-wrapper">
              <button id="close-snapshot-image" class="close-snapshot-btn">
                &times;
              </button>
              <img id="snapshot-image" />
            </div>
            <div id="snapshot-video-wrapper">
              <button id="close-snapshot-video" class="close-snapshot-btn">
                &times;
              </button>
              <video id="snapshot-video" controls loop autoplay></video>
            </div>

            <div class="file-upload-wrapper">
              <input
                type="file"
                id="media-upload"
                accept="image/*, video/*"
                disabled
              />
              <label
                for="media-upload"
                class="custom-file-upload"
                id="custom-file-upload"
                >Upload Image</label
              >
            </div>
            <div class="superposable-images">
              <label for="image-select" class="custom-label"
                >Choose Your Sticker Overlay:</label
              >
              <select id="image-select" class="custom-select">
                <option value="" disabled selected>Select Image</option>
                <!-- This is an example. -->
                <!-- <option value="image1">Image 1</option> -->
              </select>
            </div>
            <div class="controls">
              <button id="capture-image-btn" class="capture-btn" disabled>
                <i class="fa-solid fa-camera"></i>
              </button>
              <button id="capture-video-btn" class="capture-btn" disabled>
                <i class="fa-solid fa-video"></i>
              </button>
              <button id="submit-btn" class="submit-btn" disabled>
                Submit
              </button>
              <button id="publish-btn" class="publish-btn" disabled>
                Publish
              </button>
            </div>
          </section>
        </main>

        <aside class="side">
          <div class="title-wrapper">
            <h2>Previous Captures</h2>
          </div>
          <div class="thumbnail-gallery" id="thumbnail-gallery">
            <!-- Thumbnails of previous pictures will be inserted here -->
            <!-- <img src="https://picsum.photos/200/200" alt="Placeholder" />
            <img src="https://picsum.photos/200/200" alt="Placeholder" />
            <img src="https://picsum.photos/200/200" alt="Placeholder" />
            <img src="https://picsum.photos/200/200" alt="Placeholder" />
            <img src="https://picsum.photos/200/200" alt="Placeholder" />
            <img src="https://picsum.photos/200/200" alt="Placeholder" />

            <img src="https://picsum.photos/200/200" alt="Placeholder" />
            <img src="https://picsum.photos/200/200" alt="Placeholder" />
            <img src="https://picsum.photos/200/200" alt="Placeholder" />
            <img src="https://picsum.photos/200/200" alt="Placeholder" />
            <img src="https://picsum.photos/200/200" alt="Placeholder" /> -->
            <div id="media-div"></div>
            <button id="load-btn" class="load-btn" disabled>Load more</button>
          </div>
        </aside>
      </div>

      <camagru-footer></camagru-footer>
    </div>

    <script type="module" src="upload-controller.js"></script>
    <script type="module" src="../web_components/CamagruHeader.js"></script>
    <script type="module" src="../web_components/CamagruFooter.js"></script>
    <script>
      // Mobile navigation
      document.addEventListener("DOMContentLoaded", () => {
        const mobileNavButton = document.getElementById("mobile-nav-button");
        const mobileMenu = document.getElementById("mobile-menu");
        const menuItems = document.querySelectorAll(".mobile-menu-item");

        // Toggle menu
        mobileNavButton.addEventListener("click", () => {
          mobileMenu.classList.toggle("show");
        });

        // Close menu when clicking outside
        document.addEventListener("click", (e) => {
          if (
            !mobileMenu.contains(e.target) &&
            !mobileNavButton.contains(e.target)
          ) {
            mobileMenu.classList.remove("show");
          }
        });

        // Handle menu item clicks
        menuItems.forEach((item) => {
          item.addEventListener("click", () => {
            // Remove active class from all items and sections
            menuItems.forEach((i) => i.classList.remove("active"));
            document.querySelector(".main").classList.remove("active");
            document.querySelector(".side").classList.remove("active");

            // Add active class to clicked item and corresponding section
            item.classList.add("active");
            const tabName = item.getAttribute("data-tab");
            document.querySelector("." + tabName).classList.add("active");

            // Hide menu after selection
            mobileMenu.classList.remove("show");
          });
        });
      });
    </script>
  </body>
</html>
