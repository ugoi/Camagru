<!DOCTYPE html>
<!--[if lt IE 7]> <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]> <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]> <html class="no-js lt-ie9"> <![endif]-->
<!--[if gt IE 8]> <html class="no-js"> <!--<![endif]-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Profile Page</title>
    <meta name="description" content="User profile page" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="profile.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--[if lt IE 7]>
      <p
        class="browsehappy"
        style="background-color: #ffcc00; padding: 10px; text-align: center"
      >
        You are using an <strong>outdated</strong> browser. Please
        <a href="#" style="color: #0000ee">upgrade your browser</a> to improve
        your experience.
      </p>
    <![endif]-->

    <div id="successMessage" class="message-banner success">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 20"
        fill="currentColor"
      >
        <path
          fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
          clip-rule="evenodd"
        />
      </svg>
      <span>Profile updated successfully!</span>
    </div>

    <div
      class="root"
      style="
        background: white;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      "
    >
      <camagru-header></camagru-header>

      <main style="flex: 1">
        <div class="profile-container">
          <h1>Profile</h1>

          <section class="copyable" onclick="copyContent(this, 'username')">
            <h2>Username</h2>
            <p id="username"></p>
          </section>

          <section class="copyable" onclick="copyContent(this, 'email')">
            <h2>Email</h2>
            <p id="email"></p>
          </section>

          <section>
            <h2>Password</h2>
            <p id="password">******</p>
          </section>

          <div style="text-align: center">
            <a href="/edit-profile" class="edit-profile-link">Edit Profile</a>
          </div>
        </div>
      </main>

      <camagru-footer></camagru-footer>
    </div>

    <script type="module" src="../web_components/CamagruHeader.js"></script>
    <script type="module" src="../web_components/CamagruFooter.js"></script>

    <script type="module" src="profile.js"></script>

    <script>
      async function copyContent(section, id) {
        const content = document.getElementById(id).textContent;
        try {
          await navigator.clipboard.writeText(content);
          section.classList.add("copied");
          setTimeout(() => {
            section.classList.remove("copied");
          }, 2000);
        } catch (err) {
          console.error("Failed to copy text: ", err);
        }
      }
    </script>

    <script type="module">
      import { handleLoadProfile } from "./profile.js";

      window.addEventListener("DOMContentLoaded", () => {
        handleLoadProfile();

        // Check for success parameter and show message
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("showSuccess") === "true") {
          const successMessage = document.getElementById("successMessage");
          successMessage.classList.add("show");

          // Hide the message after 3 seconds
          setTimeout(() => {
            successMessage.classList.remove("show");
            // Remove the parameter from URL
            window.history.replaceState({}, "", "/profile");
          }, 3000);
        }
      });
    </script>
  </body>
</html>
