<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - Simple Website</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body style="margin: 0; font-family: 'Inter', sans-serif">
    <div class="root">
      <camagru-header></camagru-header>

      <main
        style="
          height: 100%;
          width: 100%;
          overflow-y: scroll;
          background: white;
          position: relative;
        "
      >
        <main
          style="
            max-width: 800px;
            margin: 40px auto;
            padding: 60px 40px;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            text-align: center;
            border-radius: 24px;
            position: relative;
            border: 1px solid rgba(226, 232, 240, 0.8);
          "
        >
          <div
            style="
              background: linear-gradient(120deg, #4299e1, #667eea);
              -webkit-background-clip: text;
              -webkit-text-fill-color: transparent;
              background-clip: text;
              margin-bottom: 10px;
              font-weight: 700;
              font-size: 2.8em;
            "
          >
            Welcome to CamGuru
          </div>

          <p
            style="
              color: #4a5568;
              font-size: 1.25em;
              line-height: 1.7;
              margin: 25px auto 40px;
              max-width: 600px;
              letter-spacing: -0.01em;
            "
          >
            Transform your photos with creative filters and share moments with
            friends. Your personal photo studio, right in your browser.
          </p>

          <div
            style="
              margin-top: 40px;
              display: flex;
              justify-content: center;
              gap: 20px;
            "
          >
            <button
              onclick="window.location.href='webcam'"
              style="
                background: linear-gradient(135deg, #4299e1 0%, #667eea 100%);
                color: white;
                border: none;
                padding: 18px 40px;
                cursor: pointer;
                border-radius: 14px;
                font-size: 1.1em;
                font-weight: 600;
                transition: all 0.3s ease;
                box-shadow: 0 4px 12px rgba(66, 153, 225, 0.3);
                display: flex;
                align-items: center;
                gap: 10px;
              "
              onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 8px 16px rgba(66, 153, 225, 0.35)'"
              onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(66, 153, 225, 0.3)'"
            >
              <svg
                style="width: 20px; height: 20px"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"
                ></path>
              </svg>
              Start Creating
            </button>

            <button
              onclick="window.location.href='feed'"
              style="
                background: transparent;
                color: #4299e1;
                border: 2px solid #4299e1;
                padding: 18px 40px;
                cursor: pointer;
                border-radius: 14px;
                font-size: 1.1em;
                font-weight: 600;
                transition: all 0.3s ease;
                display: flex;
                align-items: center;
                gap: 10px;
              "
              onmouseover="this.style.background='#4299e1'; this.style.color='white'"
              onmouseout="this.style.background='transparent'; this.style.color='#4299e1'"
            >
              <svg
                style="width: 20px; height: 20px"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                ></path>
              </svg>
              View Feed
            </button>
          </div>

          <div
            style="
              margin-top: 50px;
              display: flex;
              justify-content: center;
              gap: 40px;
            "
          >
            <div style="text-align: center">
              <div
                style="
                  color: #2d3748;
                  font-weight: 600;
                  font-size: 1.1em;
                  margin-bottom: 8px;
                "
              >
                Easy to Use
              </div>
              <div style="color: #718096; font-size: 0.95em">
                Intuitive interface for quick edits
              </div>
            </div>
            <div style="text-align: center">
              <div
                style="
                  color: #2d3748;
                  font-weight: 600;
                  font-size: 1.1em;
                  margin-bottom: 8px;
                "
              >
                Real-time Effects
              </div>
              <div style="color: #718096; font-size: 0.95em">
                Apply filters instantly
              </div>
            </div>
            <div style="text-align: center">
              <div
                style="
                  color: #2d3748;
                  font-weight: 600;
                  font-size: 1.1em;
                  margin-bottom: 8px;
                "
              >
                Share Instantly
              </div>
              <div style="color: #718096; font-size: 0.95em">
                Connect with friends
              </div>
            </div>
          </div>
        </main>
      </main>

      <camagru-footer></camagru-footer>
    </div>

    <script type="module" src="controller.js"></script>
    <script type="module" src="web_components/CamagruHeader.js"></script>
    <script type="module" src="web_components/CamagruFooter.js"></script>
  </body>
</html>
