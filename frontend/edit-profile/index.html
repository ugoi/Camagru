<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Edit Profile</title>
    <meta name="description" content="Edit user profile" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="edit-profile.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--[if lt IE 7]>
      <p
        class="browsehappy"
        style="background-color: #ffcc00; padding: 10px; text-align: center"
      >
        You are using an <strong>outdated</strong> browser. Please
        <a href="#" style="color: #0000ee">upgrade your browser</a> to improve
        your experience.
      </p>
    <![endif]-->

    <div id="successMessage" class="message-banner success">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 20"
        fill="currentColor"
      >
        <path
          fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
          clip-rule="evenodd"
        />
      </svg>
      <span>Profile updated successfully!</span>
    </div>

    <div id="errorMessage" class="message-banner error">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 20"
        fill="currentColor"
      >
        <path
          fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
          clip-rule="evenodd"
        />
      </svg>
      <span></span>
    </div>

    <div
      class="root"
      style="
        background: white;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      "
    >
      <camagru-header></camagru-header>

      <main style="flex: 1">
        <div class="edit-profile-container">
          <h1>Edit Profile</h1>
          <p class="subtitle">
            Please fill in this form to edit account details.
          </p>

          <form id="edit-form">
            <section>
              <h2>Username</h2>
              <input
                type="text"
                name="username"
                id="username"
                class="form-input"
              />
            </section>

            <section>
              <h2>Email</h2>
              <input type="email" name="email" id="email" class="form-input" />
            </section>

            <section>
              <h2>Password</h2>
              <input
                type="password"
                name="password"
                id="password"
                class="form-input"
              />
            </section>

            <div class="button-container">
              <button type="submit" class="save-button">Save Changes</button>
            </div>
          </form>
        </div>
      </main>

      <camagru-footer></camagru-footer>
    </div>

    <script type="module" src="../web_components/CamagruHeader.js"></script>
    <script type="module" src="../web_components/CamagruFooter.js"></script>
    <script type="module">
      import {
        handleLoadEditProfile,
        handleEditProfile,
      } from "./edit-profile.js";

      window.addEventListener(
        "DOMContentLoaded",
        (event) => {
          handleLoadEditProfile();
        },
        false
      );

      const loginForm = document.querySelector("#edit-form");
      loginForm.addEventListener("submit", (event) => {
        handleEditProfile(event);
      });
    </script>
  </body>
</html>
