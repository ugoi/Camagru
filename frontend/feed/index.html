<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feed - CamGuru</title>
    <link rel="stylesheet" href="feed.css" />
    <link rel="stylesheet" href="../utils.css" />
    <link rel="stylesheet" href="../styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="root">
      <camagru-header></camagru-header>

      <div
        id="feed"
        style="
          display: flex;
          justify-content: center;
          height: calc(100vh - 120px);
          width: 100%;
          background: white;
          position: relative;
          padding: 20px;
          overflow-y: auto;
        "
      >
        <div
          id="myMediaWrapper"
          style="max-width: 600px; width: 100%; position: relative; z-index: 1"
          class="hide-scrollbar"
        >
          <h1>Your Feed</h1>
          <div id="myMedia" class="media-container"></div>
          <button id="loadMoreButton" class="load-btn">
            <span>Load more</span>
          </button>
        </div>
      </div>

      <camagru-footer></camagru-footer>
    </div>

    <script type="module" src="../web_components/CamagruHeader.js"></script>
    <script type="module" src="../web_components/CamagruFooter.js"></script>
    <script type="module" src="feed-controller.js"></script>
  </body>
</html>
