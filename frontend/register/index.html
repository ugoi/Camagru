<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Sign Up - CamGuru</title>
    <meta name="description" content="Create your CamGuru account" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="register.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--[if lt IE 7]>
      <p
        class="browsehappy"
        style="background-color: #ffcc00; padding: 10px; text-align: center"
      >
        You are using an <strong>outdated</strong> browser. Please
        <a href="#" style="color: #0000ee">upgrade your browser</a> to improve
        your experience.
      </p>
    <![endif]-->
    <main class="register-container">
      <form id="register-form">
        <h1 class="register-title">Create Account</h1>
        <p class="register-subtitle">Join our community today</p>

        <div
          id="registerSuccess"
          class="message success-message"
          style="display: none"
        >
          <p>Registration successful</p>
        </div>
        <div
          id="registerError"
          class="message error-message"
          style="display: none"
        >
          <p>Registration failed</p>
        </div>

        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            name="username"
            id="username"
            class="form-input"
            placeholder="Choose a username"
            required
          />
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            name="email"
            id="email"
            class="form-input"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            name="password"
            id="password"
            class="form-input"
            placeholder="Create a password"
            required
          />
        </div>

        <p class="terms-text">
          By creating an account you agree to our
          <a href="#" class="terms-link">Terms of Service</a> and
          <a href="#" class="terms-link">Privacy Policy</a>
        </p>

        <button type="submit" class="register-button">Create Account</button>

        <div class="signin-prompt">
          Already have an account?
          <a href="/login" class="signin-link">Sign in</a>
        </div>
      </form>
    </main>

    <script type="module">
      import { handleRegister } from "./register.js";
      const registerForm = document.querySelector("#register-form");
      registerForm.addEventListener("submit", (event) => {
        handleRegister(event);
      });
    </script>
  </body>
</html>
