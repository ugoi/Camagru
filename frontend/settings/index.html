<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - CamGuru</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="settings.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="successMessage" class="message-banner success">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 20"
        fill="currentColor"
      >
        <path
          fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
          clip-rule="evenodd"
        />
      </svg>
      <span>Settings saved successfully!</span>
    </div>

    <div id="errorMessage" class="message-banner error">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 20"
        fill="currentColor"
      >
        <path
          fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
          clip-rule="evenodd"
        />
      </svg>
      <span></span>
    </div>

    <div
      class="root"
      style="
        background: white;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      "
    >
      <camagru-header></camagru-header>

      <main style="flex: 1">
        <div class="settings-container">
          <h1>Settings</h1>

          <section>
            <h2>Notifications</h2>
            <div class="settings-row">
              <label for="emailNotifications">Email Notifications</label>
              <label class="switch">
                <input type="checkbox" id="emailNotifications" checked />
                <span class="slider"></span>
              </label>
            </div>
          </section>

          <div style="text-align: center">
            <button class="save-button" id="saveSettingsButton">
              Save Settings
            </button>
          </div>
        </div>
      </main>

      <camagru-footer></camagru-footer>
    </div>

    <script type="module" src="../web_components/CamagruHeader.js"></script>
    <script type="module" src="../web_components/CamagruFooter.js"></script>
    <script type="module" src="controller.js"></script>
  </body>
</html>
